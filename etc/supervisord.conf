[supervisord]
nodaemon=true
logfile=/opt/openclaw-node/logs/supervisord.log
pidfile=/tmp/supervisord.pid

[program:browser]
command=/opt/openclaw-node/bin/start-browser.sh
autorestart=true
stdout_logfile=/opt/openclaw-node/logs/browser.stdout.log
stderr_logfile=/opt/openclaw-node/logs/browser.stderr.log
priority=10

[program:openclaw]
command=/opt/openclaw-node/bin/start-openclaw.sh
autorestart=true
stdout_logfile=/opt/openclaw-node/logs/openclaw.stdout.log
stderr_logfile=/opt/openclaw-node/logs/openclaw.stderr.log
priority=20
